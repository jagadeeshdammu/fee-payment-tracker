spring:
  application:
    name: fee-tracker
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/feetracker?createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    # Schema is owned by Flyway (db/migration), Hibernate never changes it.
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

app:
  jwt:
    # Dev-only default. Always set JWT_SECRET (base64, 32+ bytes) in real environments.
    secret: ${JWT_SECRET:mSwx/7KvcYBarkXUvK0UH6Ep959xyPfNSW/svRr95+E/5uaQs0I/DcD1/0G3GOer}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
  seed-demo-data: ${SEED_DEMO_DATA:true}

---
# Run without MySQL:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:feetracker;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
