# One command runs everything:  docker compose up --build
#   App:   http://localhost:8081   (login admin / admin123)
#   API:   http://localhost:8080/api/health
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: feetracker
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/feetracker
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:-mSwx/7KvcYBarkXUvK0UH6Ep959xyPfNSW/svRr95+E/5uaQs0I/DcD1/0G3GOer}
      CORS_ORIGINS: http://localhost:4200,http://localhost:8081
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  mysql-data:
